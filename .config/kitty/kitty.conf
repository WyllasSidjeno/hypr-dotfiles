# Vesper theme (Rauno Freiberg) — matches waybar/hyprland/wofi/dunst
# #101010 bg, white fg, #a0a0a0 muted, #ffc799 accent, #99ffe4 teal, #ff8080 red

font_family      Noto Sans Mono
bold_font        Noto Sans Mono Bold
italic_font      Noto Sans Mono Italic
bold_italic_font Noto Sans Mono Bold
font_size        13.0

background_opacity 0.94
text_composition_strategy legacy
window_padding_width 10

foreground #ffffff
background #101010

cursor            #ffc799
cursor_text_color #101010

selection_foreground #101010
selection_background #ffc799

url_color #99ffe4

active_border_color   #ffc799
inactive_border_color #3a3a3a

active_tab_foreground   #101010
active_tab_background   #ffc799
inactive_tab_foreground #a0a0a0
inactive_tab_background #1a1a1a
tab_bar_background      #101010

# black
color0  #101010
color8  #3a3a3a
# red
color1  #ff8080
color9  #ffa3a3
# green (mapped to teal, no dedicated green accent in Vesper)
color2  #99ffe4
color10 #bdffee
# yellow (mapped to peach accent)
color3  #ffc799
color11 #ffd9b8
# blue
color4  #9cb3ff
color12 #b8c9ff
# magenta
color5  #e0a3c4
color13 #eabdd6
# cyan
color6  #99ffe4
color14 #bdffee
# white
color7  #ffffff
color15 #ffffff

window_border_width 1pt
draw_minimal_borders yes
window_margin_width 0
hide_window_decorations yes

confirm_os_window_close 0
